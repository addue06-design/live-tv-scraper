name: Auto Update M3U Playlist

on:
  schedule:
    # 每 3 小時自動執行一次更新 (可依需求調整)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動點擊測試

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies and Virtual Display (Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable xvfb
        pip install undetected-chromedriver

    - name: Run Scraper with Virtual Display
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python scraper.py

    - name: Deploy updated M3U to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        destination_dir: ./
        keep_files: false
