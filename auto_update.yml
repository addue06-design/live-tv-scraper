name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# 關鍵：在 Workflow 內部直接宣告賦予寫入與發佈權限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Chrome and System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xvfb libxi6 libgconf-2-4 libnss3 libasound2 libatk-bridge2.0-0 libgtk-3-0
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        pip install undetected-chromedriver

    - name: Run Scraper with Virtual Display
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python scraper.py

    - name: Deploy updated M3U to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        destination_dir: ./
        keep_files: false
