name: Auto Fetch Sports M3U8

on:
  schedule:
    # 每 6 小時自動執行一次 (CRON 格式，UTC 時間)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊按鈕觸發執行

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-cv@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb libxi6 libgconf-2-4
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver

      - name: Run Scraper inside Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python scraper.py

      - name: Commit and Push Updated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sports_channels.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update sports_channels.m3u [skip ci]" && git push)
