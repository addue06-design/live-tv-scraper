name: Auto Fetch Sports M3U8

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -------------------------------------------------------------
      # 關鍵修復：啟用 Cloudflare WARP 切換出口 IP，繞過 5 秒盾封鎖
      # -------------------------------------------------------------
      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1
        with:
          mode: global

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver

      - name: Run Scraper inside Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python -u scraper.py

      - name: Commit and Push Updated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "sports_channels.m3u" ]; then
            git add sports_channels.m3u
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update sports_channels.m3u [skip ci]" && git push)
          fi
