name: Auto Fetch Sports M3U8

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Chrome
        shell: powershell
        run: |
          $chrome = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chrome)) {
            $chrome = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          }

          if (Test-Path $chrome) {
            & $chrome --version
          } else {
            Write-Host "Chrome executable not found"
          }

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver

      - name: Run Scraper
        shell: powershell
        run: |
          python -u scraper.py

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            debug_*.png
            debug_*.html
            sports_channels.m3u
          if-no-files-found: warn
          retention-days: 3

      - name: Commit and Push Updated M3U
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if (Test-Path "sports_channels.m3u") {
            git add sports_channels.m3u

            $diff = git diff --quiet
            $staged = git diff --staged --quiet

            if ($LASTEXITCODE -ne 0) {
              git commit -m "Auto update sports_channels.m3u [skip ci]"
              git push
            }
          }
