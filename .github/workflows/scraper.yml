name: Auto Fetch Sports M3U8

on:
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check Environment
        shell: cmd
        run: |
          echo ==============================================
          echo SELF-HOSTED WINDOWS RUNNER
          echo ==============================================
          echo.
          echo Computer:
          echo %COMPUTERNAME%
          echo.
          echo User:
          echo %USERNAME%
          echo.
          echo Python:
          python --version
          echo.
          echo Chrome:
          if exist "%ProgramFiles%\Google\Chrome\Application\chrome.exe" (
            "%ProgramFiles%\Google\Chrome\Application\chrome.exe" --version
          ) else if exist "%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe" (
            "%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe" --version
          ) else if exist "%LOCALAPPDATA%\Google\Chrome\Application\chrome.exe" (
            "%LOCALAPPDATA%\Google\Chrome\Application\chrome.exe" --version
          ) else (
            echo Chrome executable not found
          )

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver

      - name: Run Scraper
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 -u scraper.py

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            debug_*.png
            debug_*.html
            sports_channels.m3u
          if-no-files-found: warn
          retention-days: 3

      - name: Commit and Push Updated M3U
        shell: cmd
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if exist sports_channels.m3u (
            git add sports_channels.m3u
            git diff --quiet
            if errorlevel 1 (
              git commit -m "Auto update sports_channels.m3u [skip ci]"
              git push
            )
          )
