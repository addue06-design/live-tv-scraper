name: Auto Fetch Sports M3U8

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver

      - name: Run Scraper inside Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python scraper.py

      - name: Commit and Push Updated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 檢查檔案是否存在，存在才進行 git add 與 commit
          if [ -f "sports_channels.m3u" ]; then
            git add sports_channels.m3u
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update sports_channels.m3u [skip ci]" && git push)
          else
            echo "⚠️ 本次未成功生成 sports_channels.m3u，跳過 Commit。"
          fi
