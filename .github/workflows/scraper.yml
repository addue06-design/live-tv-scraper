name: Auto Fetch Sports M3U8

on:
  schedule:
    # 每 6 小時自動執行一次 (UTC 時間)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 允許在網頁上點擊按鈕手動觸發

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb libxi6 libgconf-2-4
          # 使用新型態 keyring 安裝 Google Chrome 避免 apt exit code 100 錯誤
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/google-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/google-archive-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver

      - name: Run Scraper inside Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python scraper.py

      - name: Commit and Push Updated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sports_channels.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update sports_channels.m3u [skip ci]" && git push)
